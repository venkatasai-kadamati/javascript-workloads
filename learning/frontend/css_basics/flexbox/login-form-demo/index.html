<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Form</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <main class="login-card">
        <section class="left-panel">
            <h1>Signin</h1>
            <form class="signin-form">
                <input type="text" value="ByteWebster" aria-label="username">
                <input type="password" value="password" aria-label="password">
                <button type="button">Signin</button>
            </form>

            <p>or signin with</p>

            <div class="social-row">
                <span class="social-icon facebook">f</span>
                <span class="social-icon google">G+</span>
                <span class="social-icon linkedin">in</span>
            </div>
        </section>

        <section class="right-panel">
            <h2>Welcome back!</h2>
            <p>
                Welcome back! We are so happy to have you here. It's great to see you again. We hope you
                had a safe and enjoyable time away.
            </p>
            <button type="button">No account yet? Signup.</button>
        </section>
    </main>
</body>
</html>
